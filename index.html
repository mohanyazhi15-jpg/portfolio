<!doctype html>
<html lang="en" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<title>Personal Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--fg:#111;--muted:#6d6d6a;--line:#e9e9e7;--soft:#f6f6f4;
  --serif:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f0f0f;--fg:#f3f3f0;--muted:#9b9b96;--line:#262626;--soft:#181818}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f0f0f;--fg:#f3f3f0;--muted:#9b9b96;--line:#262626;--soft:#181818}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:72px 28px 96px}
.eyebrow{display:flex;align-items:center;gap:16px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-bottom:56px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:48px;grid-template-columns:1fr}
@media(min-width:820px){.grid{grid-template-columns:5fr 7fr;gap:80px;align-items:start}.portrait{position:sticky;top:48px}}
.portrait{aspect-ratio:4/5;background:var(--soft);overflow:hidden;position:relative}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:96px;font-weight:400;color:var(--muted);letter-spacing:.05em}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(44px,7vw,76px);line-height:1.02;letter-spacing:-.01em;margin:0 0 14px}
.title{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:0 0 36px}
.about{font-size:17px;max-width:560px;margin:0 0 48px;white-space:pre-line}
.stats{display:flex;gap:56px;flex-wrap:wrap;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:44px}
.stat .n{font-family:var(--serif);font-size:54px;line-height:1;font-weight:500}
.stat .n sup{font-size:.5em;vertical-align:top;position:relative;top:.1em}
.stat .loc{font-family:var(--serif);font-size:28px;line-height:1.2;font-weight:500;padding-top:10px}
.label{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.block{margin-bottom:40px}
.block h2{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:7px 16px;border:1px solid var(--line);border-radius:999px}
.chip.sw{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.contact{display:flex;flex-wrap:wrap;gap:12px 32px;padding-top:8px}
.contact a{color:var(--fg);text-decoration:none;font-family:var(--serif);font-size:22px;border-bottom:1px solid var(--line);padding-bottom:2px;transition:border-color .2s}
.contact a:hover{border-color:var(--fg)}
.contact small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#editbtn{position:fixed;right:18px;top:calc(14px + env(safe-area-inset-top,0px));z-index:20;font:400 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;background:var(--fg);color:var(--bg);border:0;padding:11px 18px;border-radius:999px;cursor:pointer}
#editor{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end}
#editor .panel{background:var(--bg);width:min(480px,100%);height:100%;overflow-y:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 26px calc(28px + env(safe-area-inset-bottom,0px))}
#editor h3{font-family:var(--serif);font-size:30px;font-weight:500;margin:0 0 24px}
.f{margin-bottom:18px}
.f label{display:block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.f input,.f textarea{width:100%;font:300 15px var(--sans);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:11px 12px}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--fg)}
.f textarea{min-height:110px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted);margin-top:5px}
.up{display:flex;gap:16px;align-items:center}
.up .thumb{width:72px;height:90px;background:var(--soft);overflow:hidden;flex:none}
.up .thumb img{width:100%;height:100%;object-fit:cover}
.btn{font:400 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:12px 20px;border-radius:999px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.btn.pri{background:var(--fg);color:var(--bg)}
.row{display:flex;gap:10px;margin-top:26px;position:sticky;bottom:0;background:var(--bg);padding:14px 0}
#msg{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}
.drivebtn{display:inline-block;margin-top:36px;font:400 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--bg);background:var(--fg);padding:14px 26px;border-radius:999px}
.mode{margin-top:72px;padding-top:28px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mode h2{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:400 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:9px 18px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
</style>

mail":"Mohanyazhi15@gmail.com","whatsapp":"9344325840","drive":"https://drive.google.com/drive/folders/10YXGwZk5WKaFpx0A-HrZ5QxQF9sN6WbY?usp=sharing","theme":"auto"}</script>

<script>
(function(){
  var DEF={photo:"",name:"",title:"",about:"",years:"",location:"",skills:"",software:"",instagram:"",email:"",whatsapp:"",drive:"",theme:"auto"};
  var state=Object.assign({},DEF,JSON.parse(document.getElementById('profile-data').textContent));
  var art=null,root=document.getElementById('root');

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function list(s){return String(s||'').split(',').map(function(x){return x.trim()}).filter(Boolean)}
  function igUrl(v){v=v.trim();return /^https?:\/\//i.test(v)?v:'https://instagram.com/'+v.replace(/^@/,'').replace(/\/$/,'')}
  function igLabel(v){return '@'+v.trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/^@/,'').replace(/\/.*$/,'')}
  function waUrl(v){return 'https://wa.me/'+v.replace(/\D/g,'')}

  function render(){
    var s=state,initials=(s.name||'?').split(/\s+/).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase();
    var h='<div class="grid"><div class="portrait">'+(s.photo?'<img src="'+esc(s.photo)+'" alt="'+esc(s.name)+'">':'<div class="ph">'+esc(initials)+'</div>')+'</div><div>';
    h+='<h1>'+esc(s.name)+'</h1><p class="title">'+esc(s.title)+'</p>';
    if(s.about)h+='<p class="about">'+esc(s.about)+'</p>';
    if(s.years||s.location){h+='<div class="stats">';
      if(s.years)h+='<div class="stat"><div class="n">'+esc(s.years)+'<sup>+</sup></div><div class="label">Years of experience</div></div>';
      if(s.location)h+='<div class="stat"><div class="loc">'+esc(s.location)+'</div><div class="label">Based in</div></div>';
      h+='</div>'}
    var sk=list(s.skills),sw=list(s.software);
    if(sk.length)h+='<div class="block"><h2>Editing skills</h2><div class="chips">'+sk.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join('')+'</div></div>';
    if(sw.length)h+='<div class="block"><h2>Software expertise</h2><div class="chips">'+sw.map(function(x){return '<span class="chip sw">'+esc(x)+'</span>'}).join('')+'</div></div>';
    h+='<div class="contact">';
    if(s.instagram){var ig=s.instagram.trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/^@/,'').split(/[\/?#]/)[0];if(ig)h+='<a href="https://www.instagram.com/'+esc(ig)+'" target="_blank" rel="noopener noreferrer">@'+esc(ig)+'</a>';}
    if(s.email)h+='<a href="mailto:'+esc(s.email.trim())+'"><small>Email</small>'+esc(s.email.trim())+'</a>';
    if(s.whatsapp)h+='<a href="'+esc(waUrl(s.whatsapp))+'" target="_blank" rel="noopener"><small>WhatsApp</small>'+esc(s.whatsapp.trim())+' ↗</a>';
    h+='</div>';var dv=(s.drive||'').trim();if(dv){if(!/^https?:\/\//i.test(dv))dv='https://'+dv;h+='<a class="drivebtn" href="'+esc(dv)+'" target="_blank" rel="noopener noreferrer">View my work on Google Drive ↗</a>';}h+='</div></div>';
    root.innerHTML=h;
  }
  render();

  /* ---------- colour theme (set by the owner in Edit profile, applies to everyone) ---------- */
  function applyTheme(t){
    if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
  }
  applyTheme(state.theme);

  /* ---------- editing (owner only) ---------- */
  var FIELDS=[
    ['name','Full name','input'],['title','Professional title','input'],
    ['about','About me','textarea'],['years','Total years of experience','input','Number only, e.g. 8'],
    ['location','Location','input'],
    ['skills','Editing skills','textarea','Separate with commas'],
    ['software','Software expertise','textarea','Separate with commas'],
    ['instagram','Instagram','input','Username or full link'],
    ['email','Email','input'],['whatsapp','WhatsApp number','input','With country code, e.g. +1 555 123 4567'],['drive','Google Drive link','input','Paste your shared link. Set sharing to “Anyone with the link” so visitors can open it.']
  ];
  var draft;

  function showEditBtn(){
    var b=document.createElement('button');b.id='editbtn';b.textContent='Edit profile';
    b.onclick=openEditor;document.body.appendChild(b);
  }

  function openEditor(){
    draft=Object.assign({},state);
    var e=document.createElement('div');e.id='editor';
    var h='<div class="panel"><h3>Edit profile</h3><div class="f"><label>Profile photo</label><div class="up"><div class="thumb" id="thumb"></div><div><button class="btn" type="button" id="pick">Upload photo</button><input type="file" id="file" accept="image/*" hidden><div class="hint" id="rm"></div></div></div></div>';
    FIELDS.forEach(function(f){
      h+='<div class="f"><label for="f_'+f[0]+'">'+f[1]+'</label>'+(f[2]==='textarea'?'<textarea id="f_'+f[0]+'"></textarea>':'<input id="f_'+f[0]+'" type="text" autocomplete="off">')+(f[3]?'<div class="hint">'+f[3]+'</div>':'')+'</div>';
    });
    h+='<div class="f"><label>Colour theme</label><div class="seg" id="themeseg" role="group" aria-label="Colour theme"><button type="button" data-mode="light">Light</button><button type="button" data-mode="dark">Dark</button><button type="button" data-mode="auto">Auto</button></div><div class="hint">Applies to your whole portfolio. Auto follows each visitor’s device.</div></div>';
    h+='<div id="msg"></div><div class="row"><button class="btn pri" id="save" type="button">Save changes</button><button class="btn" id="cancel" type="button">Cancel</button></div></div>';
    e.innerHTML=h;document.body.appendChild(e);
    FIELDS.forEach(function(f){document.getElementById('f_'+f[0]).value=draft[f[0]]||''});
    drawThumb();
    var seg=e.querySelectorAll('#themeseg button');
    function mark(){seg.forEach(function(b){b.setAttribute('aria-pressed',String((draft.theme||'auto')===b.dataset.mode))})}
    mark();
    seg.forEach(function(b){b.onclick=function(){draft.theme=b.dataset.mode;applyTheme(draft.theme);mark()}});
    e.addEventListener('click',function(ev){if(ev.target===e)close()});
    document.getElementById('cancel').onclick=close;
    document.getElementById('pick').onclick=function(){document.getElementById('file').click()};
    document.getElementById('file').onchange=function(ev){var f=ev.target.files[0];if(f)readPhoto(f)};
    document.getElementById('save').onclick=save;
  }
  function close(){applyTheme(state.theme);var e=document.getElementById('editor');if(e)e.remove()}
  function say(t){document.getElementById('msg').textContent=t}
  function drawThumb(){
    document.getElementById('thumb').innerHTML=draft.photo?'<img src="'+esc(draft.photo)+'" alt="">':'';
    var rm=document.getElementById('rm');rm.innerHTML=draft.photo?'<a href="#" id="rmlink" style="color:inherit">Remove photo</a>':'';
    var l=document.getElementById('rmlink');if(l)l.onclick=function(ev){ev.preventDefault();draft.photo='';drawThumb()};
  }
  function readPhoto(file){
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var M=1100,sc=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        draft.photo=c.toDataURL('image/jpeg',.86);drawThumb();
      };
      img.onerror=function(){say('That image couldn’t be read. Try a JPG or PNG.')};
      img.src=r.result;
    };
    r.readAsDataURL(file);
  }
  async function save(){
    FIELDS.forEach(function(f){draft[f[0]]=document.getElementById('f_'+f[0]).value.trim()});
    state=Object.assign({},DEF,draft);
    if(!art){render();say('Saving isn’t available in this view, so changes are temporary.');return}
    say('Saving…');
    var clone=document.documentElement.cloneNode(true);
    clone.querySelector('#root').innerHTML='';
    clone.removeAttribute('data-theme');
    ['editbtn','editor'].forEach(function(id){var n=clone.querySelector('#'+id);if(n)n.remove()});
    clone.querySelector('#profile-data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
    try{await art.publish('<!doctype html>\n'+clone.outerHTML)}
    catch(err){render();say(err&&err.code==='conflict'?'Updated elsewhere — reloading.':'Couldn’t save. Please try again.')}
  }

  (async function(){
    try{
      if(!window.claude)return;
      var user=await claude.use('user');
      if(user&&(user.isOwner()||user.canEdit())){art=await claude.use('artifact');showEditBtn()}
    }catch(e){}
  })();
})();
</script>
